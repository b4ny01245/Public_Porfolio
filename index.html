<!DOCTYPE html>

  <style>
    /* ========================================
       GENERAL
    ======================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 40px 20px;

      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    /* ========================================
       HERO CARD
    ======================================== */

    .hero-card {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;

      display: flex;
      flex-direction: column;
      gap: 20px;

      padding: 24px;

      border: 1px solid #ddd;
      border-radius: 12px;

      background: #fff;

      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    /* ========================================
       PROFILE INFORMATION
    ======================================== */

    .profile-info {
      display: flex;
      align-items: center;

      gap: 16px;
      min-width: 0;
      flex: 1;
    }

    /* ========================================
       PROFILE PHOTO
    ======================================== */

    .profile-photo {
      width: 68px;
      height: 68px;

      flex-shrink: 0;
      overflow: hidden;

      border: 1px solid #ddd;
      border-radius: 8px;

      background: #f5f5f5;
    }

    .profile-photo img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
    }

    /* ========================================
       PROFILE DETAILS
    ======================================== */

    .profile-details {
      display: flex;
      flex-direction: column;

      gap: 6px;
      min-width: 0;
    }

    .profile-details h1 {
      font-size: 22px;
      line-height: 1.2;
      font-weight: 600;

      letter-spacing: -0.03em;
    }

    .profile-subtitle {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    .profile-subtitle span {
      color: #aaa;
      margin: 0 5px;
    }

    /* ========================================
       CONTACT LINKS
    ======================================== */

    .contact-links {
      display: flex;
      flex-wrap: wrap;

      gap: 5px 20px;

      font-family: monospace;
      font-size: 13px;
    }

    .contact-links a {
      color: #555;
      text-decoration: none;

      transition: color 0.2s ease;
    }

    .contact-links a:hover {
      color: #000;
      text-decoration: underline;
    }

    /* ========================================
       MOBILE CONTACT
    ======================================== */

    .mobile-contact {
      display: flex;
      flex-direction: column;

      gap: 2px;
    }

    .desktop-contact {
      display: none;
    }

    /* ========================================
       PROFILE BUTTONS
    ======================================== */

    .profile-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);

      gap: 8px;
    }

    .profile-button {
      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 40px;
      padding: 8px 14px;

      border: 1px solid #ccc;
      border-radius: 7px;

      background: #fff;
      color: #222;

      font-size: 14px;
      font-weight: 500;

      text-decoration: none;

      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        color 0.2s ease;
    }

    .profile-button:hover {
      background: #f5f5f5;
      border-color: #999;
      color: #000;
    }

    /* ========================================
       TABLET / DESKTOP
    ======================================== */

    @media (min-width: 768px) {

      .hero-card {
        flex-direction: row;
        flex-wrap: wrap;

        align-items: center;

        gap: 24px;
      }

      .profile-info {
        gap: 24px;
      }

      .profile-photo {
        width: 112px;
        height: 112px;
      }

      .profile-details {
        gap: 8px;
      }

      .profile-subtitle {
        font-size: 15px;
      }

      .desktop-contact {
        display: flex;
        padding-top: 2px;
      }

      .mobile-contact {
        display: none;
      }

      .profile-buttons {
        display: flex;
        flex-wrap: wrap;

        margin-left: auto;
        align-self: flex-end;
      }
    }

    /* ========================================
       SMALL MOBILE DEVICES
    ======================================== */

    @media (max-width: 480px) {

      body {
        padding: 20px 12px;
      }

      .hero-card {
        padding: 18px;
      }

      .profile-info {
        gap: 12px;
      }

      .profile-photo {
        width: 60px;
        height: 60px;
      }

      .profile-details h1 {
        font-size: 18px;
      }

      .profile-subtitle {
        font-size: 13px;
      }

      .profile-buttons {
        gap: 6px;
      }

      .profile-button {
        padding: 8px 5px;
        font-size: 13px;
      }
    }
  </style>
</head>
